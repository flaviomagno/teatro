<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2a0f13">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">FUENTEOVEJUNA</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Início</a>
      <a href="{{ '/agenda/' | relative_url }}">Agenda</a>
      <a href="{{ '/tarefas/' | relative_url }}">Afazeres</a>
      <a href="{{ '/elenco/' | relative_url }}">Elenco</a>
      <a href="{{ '/producao/' | relative_url }}">Produção</a>
      <a href="{{ '/objetos/' | relative_url }}">Objetos</a>
      <a href="{{ '/alternativas/' | relative_url }}">Soluções</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer><div class="wrap foot"><span>Fuenteovejuna · 2026</span><span>Florianópolis · SC</span></div></footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
